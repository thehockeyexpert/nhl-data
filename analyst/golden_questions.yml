# Golden questions for the conversational query layer.
# Status: DRAFT for the owner's review (2026-10-14). Questions only; no answers yet.
#
# Fields:
#   id              stable identifier
#   theme           team, season, historical, franchise, player, goalie, head_to_head, streaks, current, awards
#   question        as a fan or analyst would ask it
#   difficulty      easy, medium or hard
#   needs           data the answer requires. "fct_games" and "dim_teams" exist today.
#   answerable_now  true if today's tables can answer it, "partly" if a definition or small load is still missing
#   definitions     ids from docs/definitions.md that must be settled first
#
# Defaults already decided: team history uses lineage_id (D03); "above .500" means the opponent's
# points percentage before that game (D01).

