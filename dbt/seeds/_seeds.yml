version: 2

seeds:
  - name: game_type_labels
    description: >
      Readable names for the NHL's numeric game types. A pair gets a row only after the data
      was checked and the owner confirmed it. Anything not listed shows as 'unknown type N'.
    columns:
      - name: season
        description: Eight-digit season ID. Empty means the label applies to every season.
      - name: game_type
        description: The NHL's numeric game type.
        data_tests: [not_null]
      - name: label
        description: The readable name.
        data_tests: [not_null]
      - name: evidence
        description: What was seen in the data that justifies the label.
        data_tests: [not_null]
      - name: verified_on
        description: The date the owner confirmed it.
        data_tests: [not_null]

  - name: team_lineage_overrides
    description: >
      Cases where a club's lineage (the club followed through its moves) should differ from the
      NHL's official franchise. Each needs a reason and an independent source. Empty for now.
    columns:
      - name: team_id
        description: The NHL team ID the override applies to.
        data_tests: [unique, not_null]
      - name: lineage_id
        description: The franchise ID whose lineage this team belongs to instead.
        data_tests: [not_null]
      - name: reason
        description: Why the lineage differs from the NHL's franchise.
        data_tests: [not_null]
      - name: source
        description: An independent source confirming it.
        data_tests: [not_null]
      - name: approved_on
        description: The date the owner approved it.
        data_tests: [not_null]

  - name: birth_city_spellings
    description: >
      Spellings of the same birth city that the NHL's player list records differently (accents, Saint and St.,
      punctuation, English and local names). dim_players.birth_city_standard uses the city column. Former names
      of a place are not spellings and are not listed. Checked by birth_city_spellings_valid.
    columns:
      - name: country
        description: The NHL's three-letter birth country code.
        data_tests: [not_null]
      - name: state_province
        description: State or province code; empty outside Canada and the United States.
      - name: recorded_city
        description: The spelling as the NHL records it, to be replaced.
        data_tests: [not_null]
      - name: city
        description: The spelling to use instead, also one the NHL records.
        data_tests: [not_null]
      - name: reason
        description: Why the two are the same place, with the player counts behind the chosen spelling.
        data_tests: [not_null]
      - name: source
        description: '"Spelling only" when the names differ only in spelling; otherwise a source for the place.'
        data_tests: [not_null]
      - name: approved_on
        description: The date the owner approved it.
        data_tests: [not_null]

  - name: check_exceptions
    description: >
      Known, documented cases where a data check is allowed to fail. The checks themselves are
      not loosened. An exception with no game_id covers that check for the whole season.
    columns:
      - name: check_name
        description: The check's name, as it appears in checks.check_failures.
        data_tests: [not_null]
      - name: season
        description: The season the exception applies to.
        data_tests: [not_null]
      - name: game_id
        description: The single game it applies to. Empty for a whole-season exception.
      - name: team_id
        description: >
          The single team it applies to, for checks about a team's season. Empty when the
          exception is not about one team.
      - name: reason
        description: >
          The cause, only if a source confirms it. Otherwise it starts with 'unexplained'
          and states what was observed.
        data_tests: [not_null]
      - name: evidence
        description: The numbers or source that justify the exception.
        data_tests: [not_null]
      - name: approved_on
        description: The date the owner approved it.
        data_tests: [not_null]

  - name: canada_province_codes
    description: >
      Canadian province and territory codes as the NHL records them (ON, QC) with GeoNames' own code for each (ON is
      08), used to match birthplaces in the right province. Taken from GeoNames' admin1CodesASCII.txt.
    columns:
      - name: province_code
        description: The postal abbreviation, as in dim_players.birth_state_province.
        data_tests: [unique, not_null]
      - name: geonames_admin1_code
        description: GeoNames' admin1 code for the province.
        data_tests: [unique, not_null]

  - name: birthplace_successor_countries
    description: >
      Countries in which a birthplace recorded under another country may be found: a place recorded under RUS is
      looked for in the other former Soviet republics, CZE and SVK in each other. Used only after every match in the
      recorded country fails (match_method successor_country). Approved by the owner 2026-10-19.
    columns:
      - name: recorded_country
        description: The country as the NHL records it.
        data_tests: [not_null]
      - name: country
        description: A country to look in instead.
        data_tests: [not_null]

  - name: birthplace_manual_fixes
    description: >
      Coordinates for birthplaces that GeoNames matching cannot find, such as former towns now part of another city.
      Each row names a GeoNames place or gives coordinates, always with a source. Never guessed.
    columns:
      - name: birthplace_key
        description: The birthplace, as in dim_birthplaces.
        data_tests: [unique, not_null]
      - name: geonames_id
        description: The GeoNames place whose coordinates to use. Empty if latitude and longitude are given instead.
      - name: latitude
        description: Only when no GeoNames place fits; from the source.
      - name: longitude
        description: Only when no GeoNames place fits; from the source.
      - name: reason
        description: Why this place, in plain words.
        data_tests: [not_null]
      - name: source
        description: Where the reason and coordinates come from (a URL).
        data_tests: [not_null]
      - name: approved_on
        description: The date the owner approved the row. Empty while proposed.
