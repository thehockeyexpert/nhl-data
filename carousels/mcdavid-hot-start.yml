# Connor McDavid's start to 2026-27, as a six-slide story carousel (style/style_guide.md, "Story carousels").
# Words from style/story_reference.html, checked against MotherDuck on 2026-11-11: every number on a slide comes from
# a query under facts, re-run on every render. Edit the words freely; if you change a number, change its fact too.
accent: EDM
mode: mixed                  # hook, reveal, conclusion dark; comparison, trend, turning point light
through: 2026-11-09          # the trend chart counts games up to this date

slides:
  - type: hook
    kicker: "CONNOR McDAVID · 2026-27"
    headline: ["Nobody has", "started like this", "in 30 years."]
    image: {type: photo, commons: "File:Connor McDavid of the Edmonton Oilers.jpg", layout: panel, side: left, focus: [0.45, 0.45]}

  - type: reveal
    number: 48
    label: ["POINTS IN", "19 GAMES"]
    name: Connor McDavid
    subtitle: A point in all 19 games, and five points three times.
    stats:
      - {value: "11", label: GOALS}
      - {value: "37", label: ASSISTS}
      - {value: "2.53", label: POINTS PER GAME}
      - {value: "+24", label: PLUS-MINUS}

  - type: comparison
    top: {kicker: "CONNOR McDAVID · 2026-27", number: 48, line: through 19 games}
    bottom: {kicker: "LEON DRAISAITL · 2021-22", number: 40, line: best in 29 seasons}

  - type: trend
    title: Chasing Lemieux
    subtitle: Running total, against Lemieux's two best starts.
    games: 19
    axis_title: GAME NUMBER
    lines:                   # the first line is the subject, in the accent
      - {player_id: 8478402, season: 20262027, name: McDavid}
      - {player_id: 8448782, season: 19881989, name: Lemieux}
      - {player_id: 8448782, season: 19951996, name: Lemieux}

  - type: turning_point
    title: The playmaker
    subtitle: 37 of his 48 points are assists. That's 77%.
    stats_title: HIS 48 POINTS BY STRENGTH
    stats:
      - {value: "27", label: [EVEN, STRENGTH]}
      - {value: "19", label: [POWER, PLAY], accent: true}
      - {value: "2", label: [SHORT, HANDED]}
    rink: illustration       # drawn arrows, labelled "ILLUSTRATION, NOT TRACKED PASSES"

  - type: conclusion
    kicker: IF HE PLAYS EVERY GAME
    headline: ["On pace", "for 212."]
    context:
      - Over 84 games, that ties Gretzky's 212 (1981-82).
      - The record is 215, set by Gretzky in 1985-86.
    question: Can he get there?

caption: |
  Is Connor McDavid on another planet? 48 points in his first 19 games, with a point in every one of them. Nobody had
  started a season like this since Mario Lemieux in 1995-96.

  If he plays every remaining game, he's on pace for 212: Gretzky's 1981-82 total, three short of the record 215.
  Can he get there? Tell us in the comments.

  Regular season, games through 9 November 2026. Data: NHL.

facts:
  - claim: "Reveal: 19 games, 11 goals, 37 assists, 48 points, 2.53 per game, +24"
    sql: >
      select count(*), sum(goals), sum(assists), sum(points), round(sum(points) / count(*), 2), sum(plus_minus)
      from marts.fct_skater_games
      where player_id = 8478402 and season = 20262027 and game_type = 2 and game_date <= '2026-11-09'
    value: [19, 11, 37, 48, 2.53, 24]

  - claim: "Reveal: a point in all 19 games (games without one), five points three times, never more than five"
    sql: >
      select count(*) filter (where points = 0), count(*) filter (where points = 5), max(points)
      from marts.fct_skater_games
      where player_id = 8478402 and season = 20262027 and game_type = 2 and game_date <= '2026-11-09'
    value: [0, 3, 5]

  - claim: >-
      Comparison: the best points total in a player's first 19 games from 1996-97 to 2025-26 is Leon Draisaitl's 40
      in 2021-22, the only one at 40; 29 seasons were played in that span (no 2004-05)
    sql: >
      with g as (
        select player_id, season, points,
          row_number() over (partition by player_id, season order by game_date, game_id) as n
        from marts.fct_skater_games where game_type = 2 and season between 19961997 and 20252026
      ), f as (select season, player_id, sum(points) as pts from g where n <= 19 group by all having count(*) = 19)
      select d.full_name, f.season, f.pts, (select count(*) from f as f2 where f2.pts = f.pts),
        (select count(distinct season) from f)
      from f join marts.dim_players d using (player_id) order by f.pts desc limit 1
    value: [Leon Draisaitl, 20212022, 40, 1, 29]

  - claim: "Hook: nobody in 30 years - the last start of 48 or more in a player's first 19 games was Lemieux, 1995-96"
    sql: >
      with g as (
        select player_id, season, points,
          row_number() over (partition by player_id, season order by game_date, game_id) as n
        from marts.fct_skater_games where game_type = 2 and season < 20262027
      ), f as (select season, player_id, sum(points) as pts from g where n <= 19 group by all having count(*) = 19)
      select d.full_name, f.season, f.pts from f join marts.dim_players d using (player_id)
      where f.pts >= 48 order by f.season desc limit 1
    value: [Mario Lemieux, 19951996, 53]

  - claim: "Trend: running totals after 19 games - McDavid 48 (2026-27), Lemieux 57 (1988-89) and 53 (1995-96)"
    sql: >
      with g as (
        select player_id, season, points,
          row_number() over (partition by player_id, season order by game_date, game_id) as n
        from marts.fct_skater_games
        where game_type = 2 and game_date <= '2026-11-09'
          and ((player_id = 8478402 and season = 20262027)
            or (player_id = 8448782 and season in (19881989, 19951996)))
      )
      select player_id, season, sum(points) from g where n <= 19 group by all order by season
    value: [[8448782, 19881989, 57], [8448782, 19951996, 53], [8478402, 20262027, 48]]

  - claim: "Turning point: 27 even-strength, 19 power-play, 2 short-handed points; 37 of 48 are assists (77%)"
    sql: >
      select sum(even_strength_points), sum(power_play_points), sum(short_handed_points),
        round(100.0 * sum(assists) / sum(points))
      from marts.fct_skater_games
      where player_id = 8478402 and season = 20262027 and game_type = 2 and game_date <= '2026-11-09'
    value: [27, 19, 2, 77]

  - claim: "Conclusion: on pace for 212 over an 84-game season (48 / 19 x 84), if he plays every game"
    sql: >
      select s.scheduled_games_per_team, round(48.0 / 19 * s.scheduled_games_per_team)
      from marts.dim_seasons s where s.season = 20262027
    value: [84, 212]

  - claim: "Conclusion: Gretzky's 215 (1985-86) is the record, and his 212 (1981-82) is the next best season"
    sql: >
      select d.full_name, s.season, s.points from marts.fct_skater_seasons s join marts.dim_players d using (player_id)
      where s.game_type = 2 order by s.points desc limit 2
    value: [[Wayne Gretzky, 19851986, 215], [Wayne Gretzky, 19811982, 212]]
