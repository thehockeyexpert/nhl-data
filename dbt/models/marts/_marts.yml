version: 2

models:
  - name: fct_games
    description: >
      One row per NHL game (preseason, regular season, playoffs) with the result.
      Scores are final scores as the NHL reports them, so a shootout win counts as one goal.
      Coverage differs by era: see docs/data_coverage.md.
    columns:
      - name: game_id
        description: The NHL's ID for the game.
        data_tests: [unique, not_null]
      - name: season
        description: Eight-digit season ID, e.g. 20252026. Season 20042005 has no rows (docs/data_coverage.md, "The 2004-05 gap").
        data_tests: [not_null]
      - name: game_type_label
        description: >
          preseason, regular or playoff. Preseason is incomplete before 2005-06
          (docs/data_coverage.md, "Preseason").
        data_tests: [not_null]
      - name: game_date
        description: The North American calendar date the NHL lists the game under, not the UTC date.
        data_tests: [not_null]
      - name: home_team_id
        description: >
          The NHL's ID for the home team. Joins to dim_teams. Some preseason and early playoff
          opponents are not NHL teams (docs/data_coverage.md, "Non-NHL opponents").
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_id
      - name: away_team_id
        description: >
          The NHL's ID for the away team. Joins to dim_teams. Some preseason and early playoff
          opponents are not NHL teams (docs/data_coverage.md, "Non-NHL opponents").
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_id
      - name: is_final
        description: True once the game is finished.
      - name: last_period_type
        description: >
          The last period played. REG = regulation, OT = overtime, SO = shootout.
          OT does not mean the game was decided in overtime: up to 2003-04, 3,086 regular-season games
          went to overtime and still ended tied (is_tie). For games decided in overtime or a shootout,
          add NOT is_tie. SO only exists from 2005-06 (docs/data_coverage.md, "Ties" and "Shootouts").
      - name: winner_team_id
        description: >
          The winning team. Empty if the game is not finished or ended in a tie
          (docs/data_coverage.md, "Ties").
      - name: is_tie
        description: >
          True if a finished game ended level. Only possible in seasons that allowed ties
          (docs/data_coverage.md, "Ties").

  - name: fct_goalie_games
    description: >
      One row per goalie per game, regular season and playoffs. The team comes from the game
      (home team for H rows, away team for R rows), because the API's team abbreviations are reused
      across eras. Shots and saves only from 1955-56 (docs/data_coverage.md, "Goalie stats").
    columns:
      - name: goalie_game_key
        description: game_id and player_id joined.
        data_tests: [unique, not_null]
      - name: team_id
        description: The goalie's team in that game. Joins to dim_teams.
      - name: decision
        description: >
          The credited decision (docs/definitions.md, D04): W, L, T or OTL, or empty if none.
          From 1999-00 to 2003-04 a goalie's overtime loss is recorded as L.
      - name: is_starter
        description: True if the goalie started the game.

  - name: fct_skater_seasons
    description: >
      One row per skater per season and game type (2 regular season, 3 playoffs) with season totals, from the
      NHL stats API. Totals are not split by team: a player who changed teams has one row, with team_id empty
      and the teams in team_abbrevs and bridge_skater_season_teams. Goalies are not here (see fct_goalie_games;
      "most goals" questions add goalies' goals, docs/definitions.md D15). Ice time, shots, plus-minus and
      faceoffs are empty in early seasons (docs/data_coverage.md, "Skater stats").
    columns:
      - name: skater_season_key
        description: season, game_type and player_id joined.
        data_tests: [unique, not_null]
      - name: player_id
        description: The NHL's player ID. Joins to dim_players.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_id
      - name: season
        description: Eight-digit season ID. Joins to dim_seasons.
        data_tests: [not_null]
      - name: game_type
        description: 2 regular season, 3 playoffs.
        data_tests: [not_null]
      - name: team_id
        description: The skater's team when he played for one team that season and game type; empty otherwise. Joins to dim_teams.
      - name: team_count
        description: How many teams the skater played for that season and game type.
      - name: team_abbrevs
        description: The teams as the API lists them, for example "TOR,BOS".
      - name: games_played
        description: Games played in that season and game type.
      - name: goals
        description: Goals. A shootout goal is not a goal here (the extra goal a shootout adds to the final score is credited to nobody).
      - name: time_on_ice_per_game_seconds
        description: Average time on ice per game, in seconds. Empty before 1997-98 (docs/data_coverage.md, "Skater stats").

  - name: fct_skater_games
    description: >
      One row per skater per game, regular season and playoffs, linked to fct_games. The team comes from the game and
      home or road, so a traded player's games are split by team. Same early-era gaps as fct_skater_seasons (shots and
      plus-minus from 1959-60, ice time and faceoffs from 1997-98). Per-game rows add up to the season totals (check
      skater_games_match_seasons). Incremental.
    columns:
      - name: skater_game_key
        description: game_id and player_id joined.
        data_tests: [unique, not_null]
      - name: game_id
        description: The game. Joins to fct_games and dim_games.
        data_tests: [not_null]
      - name: player_id
        description: The player. Joins to dim_players.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_id
      - name: team_id
        description: The skater's team in that game. Joins to dim_teams. Empty only if the game is not in fct_games.
      - name: time_on_ice_seconds
        description: Time on ice in that game, in seconds. From 1997-98.

  - name: bridge_skater_season_teams
    description: >
      Which teams a skater played for in a season and game type, one row per team, without statistics. Each
      abbreviation is matched to the team that used it in that season's games, since abbreviations are reused
      across eras (check skater_team_resolves).
    columns:
      - name: skater_season_team_key
        description: skater_season_key and team_abbrev joined.
        data_tests: [unique, not_null]
      - name: team_id
        description: The team. Joins to dim_teams.

  - name: dim_players
    description: >
      One row per person in the NHL's player list, plus anyone in our skater or goalie stats who is missing from
      it. The list also holds people who never played an NHL game: use is_nhl_player (docs/definitions.md, D15).
      Birthplace is as the NHL records it (D14); identify a city by birth_city, birth_state_province and
      birth_country together.
    columns:
      - name: player_id
        description: The NHL's player ID.
        data_tests: [unique, not_null]
      - name: is_nhl_player
        description: True if the person played at least one NHL regular-season or playoff game (D15).
        data_tests: [not_null]
      - name: birth_city
        description: Birth city exactly as the NHL records it (D14). The same place can appear under more than one spelling.
      - name: birth_city_standard
        description: >
          Birth city with spellings of the same place merged (accents, Saint and St., English and local names),
          from dbt/seeds/birth_city_spellings.csv. Use this, with birth_state_province and birth_country, to group by
          city. Former names of a place (Fort William, Berlin, Leningrad) are separate places, not spellings.
          Empty when the NHL records no birth city (278 people, all with no NHL game).
      - name: birth_state_province
        description: State or province code, recorded only for players born in Canada or the United States.
      - name: birth_country
        description: Three-letter country code, for example CAN, USA, SWE.
      - name: birthplace_key
        description: >
          The birthplace as country|state_province|birth_city_standard, for example CAN|ON|Toronto. Joins to
          dim_birthplaces for latitude and longitude. Empty when there is no birth city.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_birthplaces')
                field: birthplace_key
      - name: first_nhl_season
        description: First season with an NHL regular-season or playoff game.
      - name: is_in_player_list
        description: False for the few players found only in the stats, not in the NHL's player list.

  - name: fct_draft_picks
    description: >
      One row per NHL draft pick, 1963 onward, from the NHL records site. player_id is empty for picks who never
      received an NHL player ID. season is the season that ends in the draft's year (the 2015 draft is 20142015).
    columns:
      - name: draft_pick_id
        description: The NHL records site's ID for the pick.
        data_tests: [unique, not_null]
      - name: overall_pick
        description: The pick's number in the whole draft (1 = first overall).
        data_tests: [not_null]
      - name: player_id
        description: The drafted player. Joins to dim_players. Empty for picks with no NHL player ID.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_id
      - name: team_id
        description: The team that made the pick. Joins to dim_teams.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_id
      - name: is_nhl_player
        description: True if the drafted player later played an NHL game (D15).

  - name: dim_trophies
    description: One row per NHL trophy or award in the NHL records site's list.
    columns:
      - name: trophy_id
        description: The NHL records site's trophy ID.
        data_tests: [unique, not_null]
      - name: trophy_name
        description: The trophy's name, for example Hart Memorial Trophy.

  - name: fct_award_results
    description: >
      One row per award result (winner, runner-up or finalist) for a trophy in a season, from the NHL records site.
      Names a player, a coach, a general manager or only a team. Several winners in one season are normal for some
      trophies: the Stanley Cup lists every player engraved on it, and the Vezina, Jennings and Rocket Richard have
      been shared.
    columns:
      - name: award_result_id
        description: The NHL records site's ID for the result.
        data_tests: [unique, not_null]
      - name: trophy_id
        description: Joins to dim_trophies.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_trophies')
                field: trophy_id
      - name: status
        description: WINNER, RUNNER_UP or FINALIST.
        data_tests:
          - accepted_values:
              arguments:
                values: ['WINNER', 'RUNNER_UP', 'FINALIST']
      - name: player_id
        description: The player, when the award names one. Joins to dim_players.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_id
      - name: team_id
        description: The player's or the winning team. One 1925-26 Stanley Cup runner-up uses a team ID that is not in dim_teams.

  - name: bridge_playoff_series_games
    description: >
      Which playoff series each NHL playoff game belongs to. Joins fct_games (game_id) to fct_playoff_series. The
      2004 World Cup of Hockey knockout games in the NHL's series list (game type 7) are left out.
    columns:
      - name: game_id
        description: The game. Joins to fct_games.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fct_games')
                field: game_id
      - name: playoff_series_key
        description: season, playoff_round and series_letter joined.
        data_tests: [not_null]

  - name: fct_playoff_series
    description: >
      One row per NHL playoff series: round, title, the two teams and the winner, taken from our games because the
      NHL's series list does not name the teams. The winner has more wins; with level wins, more goals only where
      games_needed_to_win is 0 (37 early series, 1917-18 to 1935-36). The 1919 Final, stopped by the flu epidemic,
      has no winner. Series against non-NHL teams include a non-NHL team (dim_teams.is_nhl_team). Answer "series
      won" questions by lineage (D03).
    columns:
      - name: playoff_series_key
        description: season, playoff_round and series_letter joined.
        data_tests: [unique, not_null]
      - name: team_a_id
        description: The series leader by wins (then goals). Joins to dim_teams.
        data_tests: [not_null]
      - name: team_b_id
        description: The other team. Joins to dim_teams.
        data_tests: [not_null]
      - name: winner_team_id
        description: The team that won the series. Empty when the series had no winner (the 1919 Final).
      - name: loser_team_id
        description: The team that lost the series. Empty when the series had no winner.
      - name: has_winner
        description: False when the series ended without a winner.
      - name: is_final_round
        description: True for the season's last round (the Stanley Cup Final in the NHL era).
      - name: nhl_winner_wins
        description: The NHL's own series score after the last game, for the winner (check playoff_series_score_matches).

  - name: fct_team_seasons
    description: >
      One row per team per regular season: the NHL's official totals from the NHL stats API, not totals of our games.
      From 2005-06 the official goals for and against leave out the extra goal a shootout win adds to the final score
      (check team_season_goals_match_games). Shots per game from 1959-60.
    columns:
      - name: team_season_key
        description: season and team_id joined.
        data_tests: [unique, not_null]
      - name: team_id
        description: Joins to dim_teams.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_id
      - name: points_pct
        description: Points / (2 x games played).

  - name: dim_seasons
    description: >
      One row per season the NHL has season facts for (2004-05 has none; it was not played): dates, scheduled
      games, the season's standings rules, and whether our checks treat it as finished.
    columns:
      - name: season
        description: Eight-digit season ID, for example 20252026.
        data_tests: [unique, not_null]
      - name: is_finished
        description: True once the season is over (checks.season_status).

  - name: dim_games
    description: >
      One row per game in fct_games: what the game was (date, type, teams, venue), without the result.
      fct_games has the same columns plus the result.
    columns:
      - name: game_id
        description: The NHL's ID for the game.
        data_tests: [unique, not_null]

  - name: fct_team_games
    description: >
      One row per team per finished regular-season or playoff game, with the result under that
      era's standings rules (docs/definitions.md, D02): OTL only in seasons with a point for an
      overtime loss, otherwise L. Points W 2, T 1, OTL 1, L 0.
    columns:
      - name: team_game_key
        description: game_id and team_id joined.
        data_tests: [unique, not_null]
      - name: result
        description: W, L, T or OTL.
        data_tests: [not_null]

  - name: fct_team_standings_by_game
    description: >
      Standings as of each regular-season game: each team's totals from its earlier games that
      season, the game itself excluded (docs/definitions.md, D01 and D02). Season-end totals are
      checked against the NHL's official totals (check standings_match_official).
    columns:
      - name: team_game_key
        description: game_id and team_id joined.
        data_tests: [unique, not_null]
      - name: points_pct_before
        description: Points / (2 x games played) before the game. Empty for a team's first game.
      - name: is_above_500_before
        description: >
          True if points_pct_before is above .500. False for a team's first game. The second-column
          definition of D01 (the literal "above .500").
        data_tests: [not_null]
      - name: league_median_pct_before
        description: >
          The median points % on that date over teams that have played at least one game before it.
      - name: is_top_half_before
        description: >
          The headline definition of D01: points_pct_before is strictly above league_median_pct_before
          and the team has played at least 10 games that season. Ties at the median do not count.
        data_tests: [not_null]

  - name: goalie_records_vs_above_500
    description: >
      DRAFT, not yet verified by the owner (docs/status.md).
      Question G01. Each goalie's career regular-season record in credited decisions (D04) against strong
      opponents. Headline (top_half_*, D01): opponents above the league median by points % before the
      game, with at least 10 games played. Second column (above_500_*): opponents above .500 by points %
      before the game. Win percentage is the headline measure, points percentage beside it (D23).
      meets_minimum_50 and meets_minimum_100 mark 50 and 100 qualifying decisions (D05); answers say which
      is shown. Any answer must say that from 1999-00 to 2003-04 a goalie's overtime loss is recorded as L,
      that ties exist only until 2003-04, that standings use each era's points rules, and that strength
      is measured before each game.
    columns:
      - name: player_id
        description: The NHL's player ID.
        data_tests: [unique, not_null]
      - name: top_half_decisions
        description: Credited decisions against top-half opponents (headline D01).
      - name: top_half_win_pct
        description: W / (W + L + T + OTL) against top-half opponents. Empty if none.
      - name: top_half_points_pct
        description: (2W + T + OTL) / (2 x decisions) against top-half opponents.
      - name: meets_minimum_50
        description: At least 50 top-half decisions (D05).
        data_tests: [not_null]
      - name: meets_minimum_100
        description: At least 100 top-half decisions, the stricter version reported alongside.
        data_tests: [not_null]
      - name: above_500_decisions
        description: Credited decisions against opponents above .500 by points % (second column).
      - name: above_500_win_pct
        description: W / (W + L + T + OTL) against above-.500 opponents. Empty if none.

  - name: dim_teams
    description: >
      One row per team identity that appears in our games, plus the NHL's two placeholder teams. A club that was renamed or moved
      usually has several rows, tied together by franchise_id and lineage_id.
    columns:
      - name: team_id
        description: The NHL's ID for this team identity.
        data_tests: [unique, not_null]
      - name: team_name
        description: The team's name under this identity.
        data_tests: [not_null]
      - name: team_abbrev
        description: The three-letter code under this identity.
      - name: is_nhl_team
        description: >
          False for opponents that are not in the NHL's team list
          (docs/data_coverage.md, "Non-NHL opponents").
        data_tests: [not_null]
      - name: is_placeholder
        description: >
          True for the NHL's two placeholder teams ("To be determined" and "NHL"), which future
          playoff games can name before the bracket is known. Never a real opponent.
        data_tests: [not_null]
      - name: first_season
        description: >
          First season of this identity. For NHL teams this comes from the NHL records site;
          for other opponents it is the first season they appear in our games.
      - name: last_season
        description: Last season of this identity. Empty for an NHL team that is still playing.
      - name: is_active
        description: True for an NHL team identity that is still playing. Empty for non-NHL opponents.
      - name: franchise_id
        description: The NHL's official franchise. Empty for non-NHL opponents.
      - name: franchise_name
        description: The franchise's current name according to the NHL.
      - name: lineage_id
        description: >
          The club followed through its moves. Equal to franchise_id unless
          seeds/team_lineage_overrides.csv says otherwise. Use this or franchise_id to
          group a club's history across renames and moves.
      - name: lineage_name
        description: The current name of the lineage.

  - name: dim_team_season
    description: >
      One row per team per regular season, 1917-18 to the current season, with the team's conference and division that
      season, from the NHL's standings. Join to dim_teams on team_id, or to games and team seasons on team_id and season.
      Conference and division are empty in seasons that had none (is_conferences_in_use, is_divisions_in_use;
      docs/data_coverage.md, "Conferences and divisions").
    columns:
      - name: team_season_key
        description: season and team_id joined. Each team appears once per season.
        data_tests: [unique, not_null]
      - name: team_id
        description: The NHL's ID for the team. Joins to dim_teams.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_id
      - name: season
        description: Eight-digit season ID. Joins to dim_seasons.
        data_tests: [not_null]
      - name: team_abbrev
        description: The team's abbreviation that season, as the standings show it.
      - name: team_name
        description: The team's name that season, as the standings show it.
      - name: conference_name
        description: >
          The team's conference that season, for example Eastern, Western, Prince of Wales or Clarence Campbell.
          Empty when is_conferences_in_use is false.
      - name: division_name
        description: >
          The team's division that season, for example Atlantic, Smythe or Canadian. Empty when is_divisions_in_use is false.
      - name: is_conferences_in_use
        description: True if the NHL used conferences that season (the NHL's standings rules).
      - name: is_divisions_in_use
        description: True if the NHL used divisions that season (the NHL's standings rules).

  - name: dim_birthplaces
    description: >
      One row per distinct birthplace in dim_players (country, state or province, standard city), with latitude and
      longitude from GeoNames (geonames.org, CC BY 4.0: credit GeoNames on anything public). Join from dim_players on
      birthplace_key. match_method says how each place was found; unmatched places have no coordinates
      (docs/data_coverage.md, "Birthplace coordinates"). Rebuilt weekly, so a brand-new birthplace can lag by a week.
    columns:
      - name: birthplace_key
        description: country|state_province|city, for example CAN|ON|Toronto or SWE||Gavle.
        data_tests: [unique, not_null]
      - name: city
        description: The standard city name (dim_players.birth_city_standard).
        data_tests: [not_null]
      - name: state_province
        description: The state or province code as the NHL records it.
      - name: country
        description: Three-letter country code as the NHL records it.
        data_tests: [not_null]
      - name: latitude
        description: Degrees north (negative is south). Empty when unmatched.
      - name: longitude
        description: Degrees east (negative is west). Empty when unmatched.
      - name: match_method
        description: >
          How the coordinates were found: manual (seeds/birthplace_manual_fixes.csv), exact (the GeoNames name),
          alternate_name, admin_area (a Canadian administrative area such as a former municipality),
          successor_country (the name found in a successor country, for example Minsk recorded under RUS), or unmatched.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [manual, exact, alternate_name, admin_area, successor_country, unmatched]
      - name: geonames_id
        description: The GeoNames place used. Empty when unmatched, or for a manual row with coordinates from another source.
      - name: population
        description: The GeoNames population of the matched place (today's figure, not at the player's birth).
