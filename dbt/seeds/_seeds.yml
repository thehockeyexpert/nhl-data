version: 2

seeds:
  - name: game_type_labels
    description: >
      Readable names for the NHL's numeric game types. A pair gets a row only after the data
      was checked and the owner confirmed it. Anything not listed shows as 'unknown type N'.
    columns:
      - name: season
        description: Eight-digit season ID. Empty means the label applies to every season.
      - name: game_type
        description: The NHL's numeric game type.
        data_tests: [not_null]
      - name: label
        description: The readable name.
        data_tests: [not_null]
      - name: evidence
        description: What was seen in the data that justifies the label.
        data_tests: [not_null]
      - name: verified_on
        description: The date the owner confirmed it.
        data_tests: [not_null]

  - name: team_lineage_overrides
    description: >
      Cases where a club's lineage (the club followed through its moves) should differ from the
      NHL's official franchise. Each needs a reason and an independent source. Empty for now.
    columns:
      - name: team_id
        description: The NHL team ID the override applies to.
        data_tests: [unique, not_null]
      - name: lineage_id
        description: The franchise ID whose lineage this team belongs to instead.
        data_tests: [not_null]
      - name: reason
        description: Why the lineage differs from the NHL's franchise.
        data_tests: [not_null]
      - name: source
        description: An independent source confirming it.
        data_tests: [not_null]
      - name: approved_on
        description: The date the owner approved it.
        data_tests: [not_null]

  - name: birth_city_spellings
    description: >
      Spellings of the same birth city that the NHL's player list records differently (accents, Saint and St.,
      punctuation, English and local names). dim_players.birth_city_standard uses the city column. Former names
      of a place are not spellings and are not listed. Checked by birth_city_spellings_valid.
    columns:
      - name: country
        description: The NHL's three-letter birth country code.
        data_tests: [not_null]
      - name: state_province
        description: State or province code; empty outside Canada and the United States.
      - name: recorded_city
        description: The spelling as the NHL records it, to be replaced.
        data_tests: [not_null]
      - name: city
        description: The spelling to use instead, also one the NHL records.
        data_tests: [not_null]
      - name: reason
        description: Why the two are the same place, with the player counts behind the chosen spelling.
        data_tests: [not_null]
      - name: source
        description: '"Spelling only" when the names differ only in spelling; otherwise a source for the place.'
        data_tests: [not_null]
      - name: approved_on
        description: The date the owner approved it.
        data_tests: [not_null]

  - name: check_exceptions
    description: >
      Known, documented cases where a data check is allowed to fail. The checks themselves are
      not loosened. An exception with no game_id covers that check for the whole season.
    columns:
      - name: check_name
        description: The check's name, as it appears in checks.check_failures.
        data_tests: [not_null]
      - name: season
        description: The season the exception applies to.
        data_tests: [not_null]
      - name: game_id
        description: The single game it applies to. Empty for a whole-season exception.
      - name: team_id
        description: >
          The single team it applies to, for checks about a team's season. Empty when the
          exception is not about one team.
      - name: reason
        description: >
          The cause, only if a source confirms it. Otherwise it starts with 'unexplained'
          and states what was observed.
        data_tests: [not_null]
      - name: evidence
        description: The numbers or source that justify the exception.
        data_tests: [not_null]
      - name: approved_on
        description: The date the owner approved it.
        data_tests: [not_null]

  - name: canada_province_codes
    description: >
      Canadian province and territory codes as the NHL records them (ON, QC) with GeoNames' own code for each (ON is
      08), used to match birthplaces in the right province. Taken from GeoNames' admin1CodesASCII.txt.
    columns:
      - name: province_code
        description: The postal abbreviation, as in dim_players.birth_state_province.
        data_tests: [unique, not_null]
      - name: geonames_admin1_code
        description: GeoNames' admin1 code for the province.
        data_tests: [unique, not_null]

  - name: birthplace_successor_countries
    description: >
      Countries in which a birthplace recorded under another country may be found: a place recorded under RUS is
      looked for in the other former Soviet republics, CZE and SVK in each other. Used only after every match in the
      recorded country fails (match_method successor_country). Approved by the owner 2026-10-19.
    columns:
      - name: recorded_country
        description: The country as the NHL records it.
        data_tests: [not_null]
      - name: country
        description: A country to look in instead.
        data_tests: [not_null]

  - name: birthplace_manual_fixes
    description: >
      Coordinates for birthplaces that GeoNames matching cannot find, such as former towns now part of another city.
      Each row names a GeoNames place or gives coordinates, always with a source. Never guessed.
    columns:
      - name: birthplace_key
        description: The birthplace, as in dim_birthplaces.
        data_tests: [unique, not_null]
      - name: geonames_id
        description: The GeoNames place whose coordinates to use. Empty if latitude and longitude are given instead.
      - name: latitude
        description: Only when no GeoNames place fits; from the source.
      - name: longitude
        description: Only when no GeoNames place fits; from the source.
      - name: reason
        description: Why this place, in plain words.
        data_tests: [not_null]
      - name: source
        description: Where the reason and coordinates come from (a URL).
        data_tests: [not_null]
      - name: approved_on
        description: The date the owner approved the row. Empty while proposed.

  - name: venues
    description: >
      Our list of NHL venues by building (arena definition, owner 2026-11-11): one arena is one physical building on
      one site; a rename or sponsor rebrand keeps it the same arena, a move or a complete rebuild makes a new one.
      building_id groups the NHL's venue names that are the same building. Covers every venue name with a
      regular-season or playoff game in fct_games, 1917-18 to today (230 names, 159 buildings, sources read
      2026-11-11); venues used only for preseason games are not all listed yet. Judgement calls (renovations counted
      as the same arena, a rebuilt arena counted as new, a name not matched) are in note.
    columns:
      - name: venue_name
        description: The venue name exactly as in fct_games.
        data_tests: [unique, not_null]
      - name: building_id
        description: Our ID for the physical building; the same for every name it has had.
        data_tests: [not_null]
      - name: building_name
        description: The building's current or last name.
        data_tests: [not_null]
      - name: city
        description: The city, in English.
        data_tests: [not_null]
      - name: country
        description: Three-letter country code, as in dim_players.birth_country (CAN, USA, SWE).
        data_tests: [not_null]
      - name: opened_year
        description: The year the building opened, where a source gives it; empty otherwise.
      - name: latitude
        description: The building's latitude in decimal degrees, from its Wikipedia article; empty where not looked up.
      - name: longitude
        description: The building's longitude in decimal degrees, from its Wikipedia article; empty where not looked up.
      - name: note
        description: Anything the source says about a rebuild, a replaced building or shared use, in our words.
      - name: source
        description: Where the building, its names and its location come from, and when it was read.
        data_tests: [not_null]

  - name: ebug_appearances
    description: >
      NHL games in which an amateur emergency backup goalie (EBUG) played (definition, owner 2026-11-11), from
      Wikipedia's list (the source the owner approved), matched to our player IDs and the NHL's goalie game records.
    columns:
      - name: player_id
        description: The NHL's player ID.
        data_tests: [unique, not_null]
      - name: game_date
        description: The game date in the NHL's records.
        data_tests: [not_null]
      - name: team_abbrev
        description: The team he played for.
        data_tests: [not_null]
      - name: source
        description: Where the appearance is listed, and when it was read.
        data_tests: [not_null]
      - name: note
        description: Any difference between the source and the NHL's records.
  - name: league_levels
    description: >
      Approved by the owner 2026-11-13 (docs/decisions.md). Our level for every league code on the NHL's player pages
      that appears before a player's NHL debut, for definition 9 ("leagues before the NHL debut", owner 2026-11-11):
      only junior, college, minor_pro and major_pro count (counts_before_nhl). Not counted: senior (amateur,
      semi-pro, military, and European third tiers and lower), youth (under 19, bantam, midget, minor), school,
      tournament (international tournaments, national and select teams, exhibitions) and unknown. A code that meant
      different leagues in different eras has one row per era (from_season, to_season). league_group merges renamed
      leagues and college conferences, so each counts once. Judgement calls are in note.
    columns:
      - name: league_level_key
        description: league_abbrev, plus '@' and from_season for a code split by era.
        data_tests: [unique, not_null]
      - name: league_abbrev
        description: The league code exactly as in fct_player_league_seasons.
        data_tests: [not_null]
      - name: from_season
        description: First season this row applies to (8-digit ID); empty means from the start.
      - name: to_season
        description: Last season this row applies to; empty means to today.
      - name: level
        description: junior, college, minor_pro, major_pro, senior, youth, school, tournament or unknown.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [junior, college, minor_pro, major_pro, senior, youth, school, tournament, unknown]
      - name: counts_before_nhl
        description: True for the four levels that count under definition 9.
        data_tests: [not_null]
      - name: league_group
        description: The league it counts as; renamed leagues and college conferences share one group.
        data_tests: [not_null]
      - name: note
        description: What the code is, in our words, and any judgement call.
  - name: world_junior_tournaments
    description: >
      The dates of every IIHF World Junior (under-20) Championship, top division, 1974 to 2026, each from its own
      English Wikipedia article (infobox, read 2026-11-13). For players' ages at the tournament (the inbox question
      "oldest and youngest World Junior player"). season is the 8-digit season the NHL's player pages file the
      tournament under (WJC-A, WJC-20): the one it falls in. 1974-1976 were unofficial invitationals.
    columns:
      - name: tournament_year
        description: The year the tournament is named after.
        data_tests: [unique, not_null]
      - name: season
        description: The 8-digit season the player pages list it under; joins to fct_player_league_seasons.season.
        data_tests: [unique, not_null]
      - name: first_day
        description: First day of the top-division tournament.
        data_tests: [not_null]
      - name: last_day
        description: Last day of the top-division tournament.
        data_tests: [not_null]
      - name: host
        description: Host country or countries, in English.
      - name: is_official
        description: False for the unofficial 1974-1976 invitationals, which are not in IIHF records.
        data_tests: [not_null]
      - name: source
        description: The article read.
      - name: note
        description: Cancellations, replays and disagreements between the infobox and the article text.
