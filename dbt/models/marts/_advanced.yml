version: 2

# Advanced stats built only from tables we already load (tag: advanced). Definitions in docs/definitions.md
# (S20 to S31 and D30 to D33).

models:
  - name: fct_team_game_shot_attempts
    description: >
      One row per team per finished regular-season or playoff game from 2009-10: shot attempts (Corsi), unblocked
      attempts (Fenwick), shots on goal and goals, for and against, in all situations and at 5-on-5
      (situation_code 1551). From fct_shots, shootouts left out. Blocked shots count for the shooting team whoever
      blocked them, the NHL's "teammate-blocked" shots (from 2023-24) included. Goals include empty-net goals.
    columns:
      - name: team_game_key
        description: game_id and team_id joined, as in fct_team_games.
        data_tests: [unique, not_null]
      - name: game_id
        description: The game. Joins to fct_games.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_games')
                field: game_id
      - name: team_id
        description: The team. Joins to dim_teams.
        data_tests: [not_null]
      - name: corsi_for
        description: Shot attempts by the team (goals, shots on goal, missed and blocked shots).
        data_tests: [not_null]
      - name: corsi_against
        description: Shot attempts by the opponent.
        data_tests: [not_null]
      - name: fenwick_for
        description: Unblocked shot attempts by the team (goals, shots on goal, missed shots).
      - name: fenwick_against
        description: Unblocked shot attempts by the opponent.
      - name: shots_on_goal_for
        description: Shots on goal by the team, goals included.
      - name: shots_on_goal_against
        description: Shots on goal by the opponent, goals included.
      - name: goals_for
        description: Goals by the team, empty-net goals included, shootouts not.
      - name: goals_against
        description: Goals by the opponent, empty-net goals included, shootouts not.
      - name: teammate_blocked_for
        description: >
          The team's attempts the NHL marks as blocked by a teammate (from 2023-24). Already counted in corsi_for;
          shown so they can be taken out.
      - name: corsi_for_5v5
        description: Shot attempts by the team at 5-on-5 with both goalies in (situation_code 1551).
      - name: corsi_against_5v5
        description: Shot attempts by the opponent at 5-on-5.

  - name: fct_team_season_advanced
    description: >
      One row per team per regular season from 1955-56: CF%, FF%, shooting %, save % and PDO, in all situations and
      at 5-on-5. All-situations shooting % and save % come from fct_goalie_games (goals and shots against goalies;
      empty-net goals and shootouts left out), from 1955-56. CF%, FF% and all 5-on-5 columns come from
      fct_team_game_shot_attempts, from 2009-10, empty before. Shares and percentages are fractions from 0 to 1.
      PDO = (shooting % + save %) x 100.
    columns:
      - name: team_season_key
        description: season and team_id joined, as in fct_team_seasons.
        data_tests: [unique, not_null]
      - name: season
        description: The season, 8 digits.
        data_tests: [not_null]
      - name: team_id
        description: The team. Joins to dim_teams.
        data_tests: [not_null]
      - name: games_played
        description: Regular-season games played (fct_team_games).
      - name: cf_pct
        description: Corsi for % = attempts for / (for + against), all situations. From 2009-10.
        data_tests:
          - value_between: {arguments: {min_value: 0, max_value: 1}}
      - name: ff_pct
        description: Fenwick for % = unblocked attempts for / (for + against), all situations. From 2009-10.
        data_tests:
          - value_between: {arguments: {min_value: 0, max_value: 1}}
      - name: shooting_pct
        description: Goals / shots on the opponents' goalies (empty-net goals left out). From 1955-56.
        data_tests:
          - value_between: {arguments: {min_value: 0, max_value: 1}}
      - name: save_pct
        description: 1 - goals / shots against the team's goalies. From 1955-56.
        data_tests:
          - value_between: {arguments: {min_value: 0, max_value: 1}}
      - name: pdo
        description: (shooting_pct + save_pct) x 100. League average is 100.
      - name: cf_pct_5v5
        description: CF% at 5-on-5 with both goalies in (situation_code 1551). From 2009-10.
        data_tests:
          - value_between: {arguments: {min_value: 0, max_value: 1}}
      - name: ff_pct_5v5
        description: FF% at 5-on-5. From 2009-10.
        data_tests:
          - value_between: {arguments: {min_value: 0, max_value: 1}}
      - name: shooting_pct_5v5
        description: 5-on-5 goals / 5-on-5 shots on goal, from the play-by-play. From 2009-10.
      - name: save_pct_5v5
        description: 1 - 5-on-5 goals against / 5-on-5 shots on goal against. From 2009-10.
      - name: pdo_5v5
        description: (shooting_pct_5v5 + save_pct_5v5) x 100. From 2009-10.

  - name: fct_skater_season_rates
    description: >
      One row per skater per regular season from 1997-98 (skater time on ice starts then), all teams combined:
      goals, assists, points and shots per 60 minutes of ice time (x 3,600 / seconds on ice). Rates on small samples
      mislead: filter on toi_minutes or games_played, or use meets_d05_minimum (docs/definitions.md, D05).
    columns:
      - name: skater_season_key
        description: season, game type 2 and player_id joined, as in fct_skater_seasons.
        data_tests: [unique, not_null]
      - name: player_id
        description: The player. Joins to dim_players.
        data_tests: [not_null]
      - name: season
        description: The season, 8 digits.
        data_tests: [not_null]
      - name: games_played
        description: Regular-season games played, all teams.
      - name: time_on_ice_seconds
        description: Total ice time in seconds.
        data_tests: [not_null]
      - name: toi_minutes
        description: Total ice time in minutes, for filtering out small samples (for example toi_minutes >= 500).
      - name: goals_per_60
        description: Goals x 3,600 / time_on_ice_seconds. Empty when the player has no recorded ice time.
      - name: assists_per_60
        description: Assists per 60 minutes.
      - name: points_per_60
        description: Points per 60 minutes.
      - name: shots_per_60
        description: Shots on goal per 60 minutes.
      - name: team_games
        description: The most regular-season games any team played that season (D05's "team games").
      - name: meets_d05_minimum
        description: True when games_played is at least half of team_games (D05, skater single-season rates).
        data_tests: [not_null]

  - name: int_shot_geometry
    description: >
      Intermediate step of our expected-goals model (D33) and of the carousel shot maps; for xG use fct_shot_xg.
      One row per shot attempt from 2009-10 (xG uses 2010-11 on), regular season and playoffs, shootouts left out, blocked shots included (for the rebound
      test): coordinates normalised so every shot attacks the net at x = +89, y = 0; distance and angle to that net;
      strength from the shooter's side (even, power_play, short_handed, empty_net, unknown); rebound flag; the bands
      used by dim_xg_goal_rates. Which net a shot attacked: home_team_defending_side when given (2019-20 on), else a
      vote of the game's offensive- and defensive-zone shots with ends changing each period (regular-season overtime
      before 2015-16 at the 3rd period's ends). See the model's SQL for the checks behind these rules.
    columns:
      - name: shot_key
        description: >
          The shot, as in fct_shots. Must still be in fct_shots: a game that changes is replaced whole, so a shot the
          NHL removes disappears; this catches one that lingers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fct_shots')
                field: shot_key
      - name: direction_source
        description: nhl_side (home_team_defending_side) or game_vote. Empty if neither could say.
      - name: x_norm
        description: x in feet, with the attacked net at +89.
      - name: y_norm
        description: y in feet, mirrored with x so the shot's side of the net is kept.
      - name: distance_ft
        description: Straight-line distance from the shot to the centre of the attacked net (89, 0), in feet.
      - name: angle_deg
        description: >
          Angle in degrees from the line straight out of the net: 0 = in front, 90 = level with the goal line,
          above 90 = from behind the net.
      - name: strength
        description: >
          From the shooter's side: empty_net when the defending goalie is out; otherwise even, power_play or
          short_handed by skaters, an extra attacker for a pulled goalie not counted. unknown without situation_code.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['even', 'power_play', 'short_handed', 'empty_net', 'unknown']
      - name: is_rebound
        description: >
          An unblocked attempt whose previous attempt in the same game and period, by either team, was by the same
          team at most 3 seconds earlier.
        data_tests: [not_null]
      - name: loaded_at
        description: When the game's play-by-play was loaded (from fct_shots). Incremental builds rebuild games newer than the table's latest.
        data_tests: [not_null]

  - name: dim_xg_goal_rates
    description: >
      The lookup table of our expected-goals model (D33): goal rate (goals / unblocked shots) by distance band, angle
      band, shot type, rebound and strength, from unblocked shots of 2010-11 to the last finished season, separately
      for two eras (xg_era: 2010-11 to 2021-22, and 2022-23 on). Six levels per era from finest (1, all five) to
      coarsest (6, all shots of the era); an empty column means "any". A shot uses the finest usable level of its
      own era (is_usable: at least 200 shots, or level 6).
    columns:
      - name: cell_key
        description: Era, level and the five band values joined with |, * for "any".
        data_tests: [unique, not_null]
      - name: xg_era
        description: 2010-11 to 2021-22, or 2022-23 on.
        data_tests: [not_null]
      - name: level
        description: 1 (finest) to 6 (all shots).
        data_tests: [not_null]
      - name: shots
        description: Unblocked shots in the cell.
      - name: goals
        description: Goals among them.
      - name: goal_rate
        description: goals / shots.
        data_tests:
          - not_null
          - value_between: {arguments: {min_value: 0, max_value: 1}}
      - name: is_usable
        description: True when the cell holds at least 200 shots (always true at level 6).

  - name: fct_shot_xg
    description: >
      One row per unblocked shot attempt (goal, shot on goal, missed shot) from 2010-11, regular season and playoffs,
      shootouts left out, with its expected-goals value from our own transparent model (D33): the goal rate of the
      finest usable cell of dim_xg_goal_rates. Blocked attempts count as 0 xG and are not listed. Not the xG of
      MoneyPuck or the NHL; answers must say it is ours.
    columns:
      - name: shot_key
        description: >
          The shot, as in fct_shots. Must still be in int_shot_geometry (see there).
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_shot_geometry')
                field: shot_key
      - name: game_id
        description: The game. Joins to fct_games.
        data_tests: [not_null]
      - name: xg
        description: Expected goals for this shot, from 0 to 1.
        data_tests:
          - not_null
          - value_between: {arguments: {min_value: 0, max_value: 1}}
      - name: xg_level
        description: The lookup level used, 1 (finest) to 6 (all shots).
        data_tests: [not_null]
      - name: xg_rates_version
        description: >
          Fingerprint of the goal rates this shot was scored with. All rows share one value; when dim_xg_goal_rates
          changes (normally once a year, when a season finishes), every shot is scored again.
        data_tests: [not_null]
      - name: loaded_at
        description: When the game's play-by-play was loaded (from int_shot_geometry).
      - name: xg_cell_key
        description: The dim_xg_goal_rates cell used.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_xg_goal_rates')
                field: cell_key
      - name: is_5v5
        description: 5-on-5 with both goalies in (situation_code 1551).

  - name: fct_skater_season_xg
    description: >
      One row per player per season and game type (2 regular season, 3 playoffs) from 2010-11: unblocked attempts,
      goals, expected goals (D33) and goals above expected (S25), all situations and 5-on-5. From fct_shot_xg; goals
      are the player's non-shootout goals, empty-net goals included.
    columns:
      - name: skater_season_key
        description: season, game type and player_id joined, as in fct_skater_seasons.
        data_tests: [unique, not_null]
      - name: player_id
        description: The shooter. Joins to dim_players.
        data_tests: [not_null]
      - name: xg
        description: Sum of the player's shots' xG.
        data_tests: [not_null]
      - name: goals_above_expected
        description: goals - xg. Positive means the player finished better than an average shooter from the same spots.

  - name: fct_team_game_xg
    description: >
      One row per team per finished regular-season or playoff game from 2010-11: expected goals for (xGF) and against
      (xGA), xGF% = xGF / (xGF + xGA), and actual non-shootout goals, in all situations and at 5-on-5. Our model (D33).
    columns:
      - name: team_game_key
        description: game_id and team_id joined, as in fct_team_games.
        data_tests: [unique, not_null]
      - name: game_id
        description: The game. Joins to fct_games.
        data_tests: [not_null]
      - name: team_id
        description: The team. Joins to dim_teams.
        data_tests: [not_null]
      - name: xgf_pct
        description: xGF / (xGF + xGA), all situations.
        data_tests:
          - value_between: {arguments: {min_value: 0, max_value: 1}}
      - name: xgf_pct_5v5
        description: xGF% at 5-on-5.
        data_tests:
          - value_between: {arguments: {min_value: 0, max_value: 1}}

  - name: fct_team_season_xg
    description: >
      One row per team per regular season from 2010-11: xGF, xGA, xGF% and actual non-shootout goals, all situations
      and 5-on-5, summed from fct_team_game_xg. Our model (D33).
    columns:
      - name: team_season_key
        description: season and team_id joined, as in fct_team_seasons.
        data_tests: [unique, not_null]
      - name: team_id
        description: The team. Joins to dim_teams.
        data_tests: [not_null]
      - name: xgf_pct
        description: xGF / (xGF + xGA), all situations.
        data_tests:
          - value_between: {arguments: {min_value: 0, max_value: 1}}
      - name: xgf_pct_5v5
        description: xGF% at 5-on-5.
        data_tests:
          - value_between: {arguments: {min_value: 0, max_value: 1}}
      - name: goals_for_above_expected
        description: goals_for - xgf.
      - name: goals_against_below_expected
        description: xga - goals_against. Positive means the team's goalies allowed fewer goals than expected.
