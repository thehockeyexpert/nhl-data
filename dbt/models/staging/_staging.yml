version: 2

models:
  - name: stg_nhl_web__schedule_games
    description: >
      One row per game from the NHL weekly schedule (api-web.nhle.com). Includes preseason,
      regular season, playoffs and any special events the NHL lists, such as the Olympics.
    columns:
      - name: game_id
        description: The NHL's ID for the game, e.g. 2025020001.
        data_tests: [unique, not_null]
      - name: season
        description: Eight-digit season ID, e.g. 20252026.
        data_tests: [not_null]
      - name: game_type
        description: The NHL's numeric game type.
        data_tests: [not_null]
      - name: game_type_label
        description: >
          Readable game type from seeds/game_type_labels.csv. Pairs of season and game type
          that have not been verified are labelled 'unknown type N'.
        data_tests: [not_null]
      - name: game_date
        description: The North American calendar date the NHL lists the game under, not the UTC date.
      - name: home_team_name
        description: Place name and team name as the schedule gives them, e.g. "Florida Panthers".
      - name: is_final
        description: True once the game is finished.
      - name: last_period_type
        description: >
          The last period played. REG = regulation, OT = overtime, SO = shootout. An OT game up to
          2003-04 can still have ended tied (docs/data_coverage.md, "Ties" and "Shootouts").

  - name: stg_nhl_stats__games
    description: >
      One row per game from the NHL stats API game list. Thinner than the weekly schedule and
      used as an independent cross-check. Includes scheduled playoff games that were never played
      and the 20042005 rows (docs/data_coverage.md, "The 2004-05 gap").
    columns:
      - name: game_id
        description: The NHL's ID for the game.
        data_tests: [unique, not_null]
      - name: season
        description: Eight-digit season ID.
        data_tests: [not_null]
      - name: game_type_label
        description: Readable game type from seeds/game_type_labels.csv, or 'unknown type N'.
        data_tests: [not_null]
      - name: is_final
        description: True for finished games (state 6 or 7 with a last period recorded).

  - name: stg_nhl_stats__seasons
    description: One row per season with the NHL's own facts about it, used by the data checks.
    columns:
      - name: season
        description: Eight-digit season ID. 20042005 is absent (docs/data_coverage.md, "The 2004-05 gap").
        data_tests: [unique, not_null]
      - name: scheduled_games_per_team
        description: >
          Games each team was scheduled to play. In some seasons teams played fewer than this
          (see seeds/check_exceptions.csv, check season_balanced).
      - name: total_regular_season_games
        description: Regular-season games in the season according to the NHL.
        data_tests: [not_null]
      - name: total_playoff_games
        description: Playoff games played in the season according to the NHL.
      - name: is_ties_in_use
        description: True for seasons in which a game could end in a tie (docs/data_coverage.md, "Ties").

  - name: stg_nhl_stats__teams
    description: One row per team identity in the NHL stats API team list.
    columns:
      - name: team_id
        description: The NHL's ID for this team identity.
        data_tests: [unique, not_null]
      - name: franchise_id
        description: The NHL franchise the team belongs to. Empty for two placeholder rows.

  - name: stg_nhl_records__franchises
    description: One row per NHL franchise from records.nhl.com.
    columns:
      - name: franchise_id
        description: The NHL's franchise ID.
        data_tests: [unique, not_null]

  - name: stg_nhl_records__franchise_team_totals
    description: >
      One row per team identity and game type from records.nhl.com, giving the seasons each
      team identity played.
    columns:
      - name: team_id
        description: The NHL's ID for this team identity.
        data_tests: [not_null]

  - name: stg_nhl_records__players
    description: >
      One row per player from records.nhl.com, biographical columns only. Birthplace is as the
      NHL records it; the state or province is only recorded for some countries.
    columns:
      - name: player_id
        description: The NHL's player ID, the same ID used in game-level stats.
        data_tests: [unique, not_null]
      - name: full_name
        description: The player's name as the NHL writes it.
        data_tests: [not_null]
      - name: birth_date
        description: Date of birth. Empty where the NHL has none.
      - name: shoots_catches
        description: L or R. For goalies this is the catching hand.
      - name: is_deleted
        description: The NHL's own flag for a deleted player record.

  - name: stg_nhl_records__draft_picks
    description: One row per NHL draft pick from records.nhl.com. Drafts start in 1963.
    columns:
      - name: draft_pick_id
        description: The NHL's ID for the pick.
        data_tests: [unique, not_null]
      - name: draft_year
        description: Calendar year of the draft.
        data_tests: [not_null]
      - name: player_id
        description: The NHL's player ID. Empty for picks who never received one.

  - name: stg_nhl_records__trophies
    description: One row per trophy or award listed by records.nhl.com.
    columns:
      - name: trophy_id
        description: The NHL's ID for the trophy.
        data_tests: [unique, not_null]
      - name: trophy_name
        description: Full name of the trophy.
        data_tests: [not_null]

  - name: stg_nhl_records__award_results
    description: >
      One row per award result from records.nhl.com: a winner, runner-up or finalist for a trophy
      in a season. Some trophies go to teams, coaches or general managers instead of players.
      Shared awards have more than one winner.
    columns:
      - name: award_result_id
        description: The NHL's ID for the result row.
        data_tests: [unique, not_null]
      - name: trophy_id
        description: Joins to stg_nhl_records__trophies.
        data_tests: [not_null]
      - name: season
        description: Eight-digit season ID the award belongs to.
        data_tests: [not_null]
      - name: status
        description: WINNER, RUNNER_UP or FINALIST.
        data_tests: [not_null]

  - name: stg_nhl_records__playoff_series_games
    description: >
      One row per playoff game from records.nhl.com, with its round, series and the series score
      after that game. Team IDs are not included; join game_id to the game tables for them.
    columns:
      - name: game_id
        description: The NHL's ID for the game.
        data_tests: [unique, not_null]
      - name: season
        description: Eight-digit season ID.
        data_tests: [not_null]

  - name: stg_nhl_web__standings_rules
    description: >
      One row per season with the standings rules the NHL used (ties, a point for an overtime loss,
      tie-breakers, wild cards, conferences and divisions). Used for points by era (docs/definitions.md, D02).
    columns:
      - name: season
        description: Eight-digit season ID.
        data_tests: [unique, not_null]

  - name: stg_nhl_stats__skater_games
    description: >
      One row per skater per game, regular season and playoffs, from the NHL stats API's skater summary (isGame=true).
      Incremental: each build reads only raw responses loaded since the last build. Same early-era gaps as the season
      totals (docs/data_coverage.md, "Skater stats").
    columns:
      - name: skater_game_key
        description: game_id and player_id joined.
        data_tests: [unique, not_null]
      - name: game_id
        description: The NHL's ID for the game.
        data_tests: [not_null]
      - name: player_id
        description: The NHL's player ID.
        data_tests: [not_null]

  - name: stg_nhl_stats__skater_seasons
    description: >
      One row per skater per season and game type (2 regular season, 3 playoffs), from the NHL stats API's
      skater summary. A player who played for several teams in a season has one row, with team_abbrevs listing
      them (for example "TOR,BOS"); the totals are not split by team. Ice time, shots, plus-minus and faceoffs
      are empty in early seasons (docs/data_coverage.md, "Skater stats").
    columns:
      - name: skater_season_key
        description: season, game_type and player_id joined.
        data_tests: [unique, not_null]
      - name: player_id
        description: The NHL's player ID.
        data_tests: [not_null]
      - name: game_type
        description: 2 regular season, 3 playoffs, taken from the request.
        data_tests: [not_null]

  - name: stg_nhl_stats__goalie_games
    description: >
      One row per goalie per game, regular season and playoffs, from the NHL stats API. Shots against
      and saves are recorded from 1955-56; goalie overtime losses only from 2005-06, so 1999-00 to
      2003-04 goalie overtime losses appear as losses (docs/data_coverage.md, "Goalie stats").
    columns:
      - name: goalie_game_key
        description: game_id and player_id joined, one per goalie per game.
        data_tests: [unique, not_null]
      - name: game_id
        description: The NHL's ID for the game.
        data_tests: [not_null]
      - name: player_id
        description: The NHL's player ID.
        data_tests: [not_null]
      - name: home_road
        description: H if the goalie played for the home team, R for the away team.
        data_tests: [not_null]

  - name: stg_nhl_stats__team_seasons
    description: >
      The NHL's official regular-season totals for every team-season (games, wins, losses, ties,
      overtime losses, points, shots, team shutouts). Used to check derived standings and goalie totals.
    columns:
      - name: team_season_key
        description: season and team_id joined.
        data_tests: [unique, not_null]
      - name: points
        description: Official standings points.

  - name: season_status
    description: >
      One row per season with season facts, saying whether the data checks treat it as finished:
      the NHL's planned end date has passed and no regular-season or playoff game is still scheduled.
    columns:
      - name: season
        description: Eight-digit season ID.
        data_tests: [unique, not_null]
      - name: is_finished
        description: True once count and completeness checks apply to the season.
        data_tests: [not_null]

  - name: season_in_progress_notes
    description: >
      Games in a season that is not finished that need a look but are not failures: postponed,
      suspended or cancelled games, and past games not final yet. Never fails the build.
    columns:
      - name: game_id
        description: The NHL's ID for the game.
        data_tests: [unique, not_null]
      - name: note
        description: postponed, suspended, cancelled, or dated before today and not final yet.

  - name: goalie_saves_plus_one_by_season
    description: >
      Monitoring for the saves era rule: from 2022-23, per season, how many goalie rows have saves +
      goals against exactly one more than shots against (observed, unexplained; docs/data_coverage.md,
      "Goalie stats"). Check goalie_saves_plus_one_rate fails if the share exceeds 2% in a season with
      at least 500 goalie rows.
    columns:
      - name: season
        description: Eight-digit season ID, 2022-23 onward.
        data_tests: [unique, not_null]
      - name: plus_one_share
        description: plus_one_rows / goalie_rows_with_shots.

  - name: check_failures
    description: >
      Every row that breaks a data check, before documented exceptions are removed.
      Query it to see what is failing and why. Stored as a table, so it shows the failures as of
      its last build; it is rebuilt before the checks on every run.
    columns:
      - name: check_name
        description: Which check the row breaks.
        data_tests: [not_null]
      - name: season
        description: The season concerned.
      - name: game_id
        description: The game concerned, for checks about single games.
      - name: detail
        description: What was expected and what was found.
      - name: team_id
        description: The team concerned, for checks about a team or a team's season.
