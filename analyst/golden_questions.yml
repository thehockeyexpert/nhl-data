# Golden questions for the conversational query layer.
# Status: DRAFT for the owner's review (2026-10-14). Questions only; no answers yet.
#
# Fields:
#   id              stable identifier. Season questions are SE01 to SE05 (renamed from S01 to S05 on 2026-10-17,
#                   so they do not clash with the stat terms S01 to S36 in docs/definitions.md)
#   theme           team, season, historical, franchise, player, goalie, head_to_head, streaks, current, awards
#   question        as a fan or analyst would ask it
#   difficulty      easy, medium or hard
#   needs           data the answer requires. "fct_games" and "dim_teams" exist today.
#   answerable_now  true if today's tables can answer it, "partly" if a definition or small load is still missing
#   definitions     ids from docs/definitions.md that must be settled first
#   source          claude_draft (drafted by Claude) or owner (the owner's own wording, unchanged)
#   flags           optional: ambiguous, not_in_nhl_data, partial_history
#   proposed_wording optional: a suggested rewording for the owner to approve; the question itself is unchanged
#   review_note     optional: why it is flagged and what would be needed
#   in_scope        optional: true once the owner has decided the question stays in scope
#   load_status     optional: not_started, in_progress or done, for the data the question is waiting on
#   blocked_on      optional: exactly what is missing before it can be answered (data or undecided definitions)
#
# Defaults already decided: team history uses lineage_id (D03); "above .500" means the opponent's
# points percentage before that game (D01).

