version: 2

sources:
  - name: raw
    description: API responses exactly as received, loaded by the Python code in ingest/.
    database: nhl
    schema: raw
    tables:
      - name: nhl_web__schedule
        description: One row per weekly schedule response from api-web.nhle.com.
      - name: nhl_stats__game
        description: One row per season game-list response from the NHL stats API.
      - name: nhl_stats__season
        description: One row per season-facts response from the NHL stats API.
      - name: nhl_stats__team
        description: The NHL stats API team list. Not tied to a season.
      - name: nhl_records__franchise
        description: The franchise list from records.nhl.com. Not tied to a season.
      - name: nhl_records__franchise_team_totals
        description: Per-team totals from records.nhl.com, used for the seasons each team played.
      - name: nhl_records__player
        description: The full player list from records.nhl.com, one response. Not tied to a season.
      - name: nhl_records__draft
        description: Every draft pick from records.nhl.com, one response.
      - name: nhl_records__trophy
        description: The trophy list from records.nhl.com.
      - name: nhl_records__award_details
        description: Award winners, runners-up and finalists from records.nhl.com, one response.
      - name: nhl_records__playoff_series
        description: One row per playoff series game from records.nhl.com, one response.
      - name: nhl_web__standings_season
        description: The standings rules in use each season, from api-web.nhle.com.
      - name: geonames__cities500
        description: >
          GeoNames cities500 (every place with at least 500 people), one row per line of the file, untouched. Replaced,
          not appended, on each refresh (decided 2026-10-19). GeoNames, CC BY 4.0.
      - name: geonames__ca
        description: The GeoNames file for Canada, one row per line, untouched. Replaced on each refresh. CC BY 4.0.
      - name: geonames__country_info
        description: GeoNames' country list, one row per line, untouched. Replaced on each refresh. CC BY 4.0.
      - name: nhl_web__standings
        description: One row per season of standings from api-web.nhle.com, taken on the season's first standings day.
      - name: nhl_stats__goalie_game
        description: One row per season and game type (regular season, playoffs) of per-game goalie stats from the NHL stats API.
      - name: nhl_stats__skater_game
        description: One row per date window (season, game type, first and last date) of per-game skater stats from the NHL stats API.
      - name: nhl_stats__skater_season
        description: One row per season and game type (regular season, playoffs) of skater season totals from the NHL stats API's skater summary.
      - name: nhl_stats__team_season
        description: The NHL's official regular-season totals for every team-season, one response from the NHL stats API.
