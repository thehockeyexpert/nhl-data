# dbt's settings file for this project.
name: nhl_data
version: "1.0.0"

# Which connection in profiles.yml to use.
profile: nhl_data

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

# Folders dbt generates and can safely delete.
clean-targets: ["target", "dbt_packages"]

models:
  nhl_data:
    # Copy each model's and column's description into MotherDuck as a comment, so tools that only see
    # the database (such as the MotherDuck MCP server) can read them. Costs one statement per model and
    # per described column on every build of that model.
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: staging
      +materialized: view   # staging is light reshaping, so it is stored as a saved query
    marts:
      +schema: marts
      +materialized: table  # marts are stored as real tables so they are fast to query
    checks:
      +schema: checks
      +materialized: view   # every data check's failing rows, in one place

# Seeds are small hand-written CSV files that dbt loads as tables.
# They hold decisions we made ourselves (labels, overrides, exceptions), not NHL data.
seeds:
  nhl_data:
    +schema: reference
    game_type_labels:
      +column_types:
        season: integer
        game_type: integer
        label: varchar
        evidence: varchar
        verified_on: date
    team_lineage_overrides:
      +column_types:
        team_id: integer
        lineage_id: integer
        reason: varchar
        source: varchar
        approved_on: date
    check_exceptions:
      +column_types:
        check_name: varchar
        season: integer
        game_id: bigint
        team_id: integer
        reason: varchar
        evidence: varchar
        approved_on: date
    birth_city_spellings:
      +column_types:
        country: varchar
        state_province: varchar
        recorded_city: varchar
        city: varchar
        reason: varchar
        source: varchar
        approved_on: date
