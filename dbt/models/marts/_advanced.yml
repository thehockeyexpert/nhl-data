version: 2

# Advanced stats built only from tables we already load (tag: advanced). Definitions in docs/definitions.md
# (S20 to S31 and D30 to D33).

models:
  - name: fct_team_game_shot_attempts
    description: >
      One row per team per finished regular-season or playoff game from 2009-10: shot attempts (Corsi), unblocked
      attempts (Fenwick), shots on goal and goals, for and against, in all situations and at 5-on-5
      (situation_code 1551). From fct_shots, shootouts left out. Blocked shots count for the shooting team whoever
      blocked them, the NHL's "teammate-blocked" shots (from 2023-24) included. Goals include empty-net goals.
    columns:
      - name: team_game_key
        description: game_id and team_id joined, as in fct_team_games.
        data_tests: [unique, not_null]
      - name: game_id
        description: The game. Joins to fct_games.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_games')
                field: game_id
      - name: team_id
        description: The team. Joins to dim_teams.
        data_tests: [not_null]
      - name: corsi_for
        description: Shot attempts by the team (goals, shots on goal, missed and blocked shots).
        data_tests: [not_null]
      - name: corsi_against
        description: Shot attempts by the opponent.
        data_tests: [not_null]
      - name: fenwick_for
        description: Unblocked shot attempts by the team (goals, shots on goal, missed shots).
      - name: fenwick_against
        description: Unblocked shot attempts by the opponent.
      - name: shots_on_goal_for
        description: Shots on goal by the team, goals included.
      - name: shots_on_goal_against
        description: Shots on goal by the opponent, goals included.
      - name: goals_for
        description: Goals by the team, empty-net goals included, shootouts not.
      - name: goals_against
        description: Goals by the opponent, empty-net goals included, shootouts not.
      - name: teammate_blocked_for
        description: >
          The team's attempts the NHL marks as blocked by a teammate (from 2023-24). Already counted in corsi_for;
          shown so they can be taken out.
      - name: corsi_for_5v5
        description: Shot attempts by the team at 5-on-5 with both goalies in (situation_code 1551).
      - name: corsi_against_5v5
        description: Shot attempts by the opponent at 5-on-5.

  - name: fct_team_season_advanced
    description: >
      One row per team per regular season from 1955-56: CF%, FF%, shooting %, save % and PDO, in all situations and
      at 5-on-5. All-situations shooting % and save % come from fct_goalie_games (goals and shots against goalies;
      empty-net goals and shootouts left out), from 1955-56. CF%, FF% and all 5-on-5 columns come from
      fct_team_game_shot_attempts, from 2009-10, empty before. Shares and percentages are fractions from 0 to 1.
      PDO = (shooting % + save %) x 100.
    columns:
      - name: team_season_key
        description: season and team_id joined, as in fct_team_seasons.
        data_tests: [unique, not_null]
      - name: season
        description: The season, 8 digits.
        data_tests: [not_null]
      - name: team_id
        description: The team. Joins to dim_teams.
        data_tests: [not_null]
      - name: games_played
        description: Regular-season games played (fct_team_games).
      - name: cf_pct
        description: Corsi for % = attempts for / (for + against), all situations. From 2009-10.
        data_tests:
          - value_between: {arguments: {min_value: 0, max_value: 1}}
      - name: ff_pct
        description: Fenwick for % = unblocked attempts for / (for + against), all situations. From 2009-10.
        data_tests:
          - value_between: {arguments: {min_value: 0, max_value: 1}}
      - name: shooting_pct
        description: Goals / shots on the opponents' goalies (empty-net goals left out). From 1955-56.
        data_tests:
          - value_between: {arguments: {min_value: 0, max_value: 1}}
      - name: save_pct
        description: 1 - goals / shots against the team's goalies. From 1955-56.
        data_tests:
          - value_between: {arguments: {min_value: 0, max_value: 1}}
      - name: pdo
        description: (shooting_pct + save_pct) x 100. League average is 100.
      - name: cf_pct_5v5
        description: CF% at 5-on-5 with both goalies in (situation_code 1551). From 2009-10.
        data_tests:
          - value_between: {arguments: {min_value: 0, max_value: 1}}
      - name: ff_pct_5v5
        description: FF% at 5-on-5. From 2009-10.
        data_tests:
          - value_between: {arguments: {min_value: 0, max_value: 1}}
      - name: shooting_pct_5v5
        description: 5-on-5 goals / 5-on-5 shots on goal, from the play-by-play. From 2009-10.
      - name: save_pct_5v5
        description: 1 - 5-on-5 goals against / 5-on-5 shots on goal against. From 2009-10.
      - name: pdo_5v5
        description: (shooting_pct_5v5 + save_pct_5v5) x 100. From 2009-10.

  - name: fct_skater_season_rates
    description: >
      One row per skater per regular season from 1997-98 (skater time on ice starts then), all teams combined:
      goals, assists, points and shots per 60 minutes of ice time (x 3,600 / seconds on ice). Rates on small samples
      mislead: filter on toi_minutes or games_played, or use meets_d05_minimum (docs/definitions.md, D05).
    columns:
      - name: skater_season_key
        description: season, game type 2 and player_id joined, as in fct_skater_seasons.
        data_tests: [unique, not_null]
      - name: player_id
        description: The player. Joins to dim_players.
        data_tests: [not_null]
      - name: season
        description: The season, 8 digits.
        data_tests: [not_null]
      - name: games_played
        description: Regular-season games played, all teams.
      - name: time_on_ice_seconds
        description: Total ice time in seconds.
        data_tests: [not_null]
      - name: toi_minutes
        description: Total ice time in minutes, for filtering out small samples (for example toi_minutes >= 500).
      - name: goals_per_60
        description: Goals x 3,600 / time_on_ice_seconds. Empty when the player has no recorded ice time.
      - name: assists_per_60
        description: Assists per 60 minutes.
      - name: points_per_60
        description: Points per 60 minutes.
      - name: shots_per_60
        description: Shots on goal per 60 minutes.
      - name: team_games
        description: The most regular-season games any team played that season (D05's "team games").
      - name: meets_d05_minimum
        description: True when games_played is at least half of team_games (D05, skater single-season rates).
        data_tests: [not_null]
